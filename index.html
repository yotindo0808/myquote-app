<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專屬金句抽卡機</title>
    
    <style>
        /* 🌟 載入台灣粉圓體，解決缺字問題 */
        @font-face {
            font-family: 'OpenHuninn';
            src: url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.0/jf-openhuninn-2.0.ttf') format('truetype');
            font-display: swap;
        }

        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #1a1a2e;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
            /* 全站預設圓體 */
            font-family: 'OpenHuninn', 'Microsoft JhengHei', sans-serif; 
        }

        .card {
            /* 淺色毛玻璃基底 */
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 50px 40px;
            
            /* 置中與間距調整 */
            width: 75%;
            max-width: 450px;
            margin: 40px; 
            
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.5s;
        }

.quote-text {
            font-size: 1.4rem;
            line-height: 1.5;
letter-spacing: 1.5px;    /* 🌟 加碼推薦：加上 2px 的字距，讓每個字之間不要太擁擠，會更有文青感！ */
            margin-bottom: 25px;
            min-height: 80px;

            /* 1️⃣ 最乾淨的純白字體 */
            color: #ffffff; 
            
            /* 👑 2️⃣ 絕對不吃字的「八方包圍外框 + 立體積木」疊加法 */
            text-shadow: 
                /* 第一層：上下左右的黑色 1px 外框 (絕對不會往內吃掉白字) */
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px -1px 0 #000,
                 0px  1px 0 #000,
                -1px  0px 0 #000,
                 1px  0px 0 #000,
/* 第二層：往右下角延伸的立體厚度 */
                 2px 2px 0 #000,
                 3px 3px 0 #000;

            transition: font-family 0.5s ease; 
        }

        .quote-source {
            font-size: 0.9rem;
            opacity: 0.7;
            font-style: italic;
            letter-spacing: 1px;
            
            color: #ffffff;
            /* 出處文字較小，用簡單的四方包圍 + 淺立體即可 */
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 2px 2px 0 #000;
        }

        button {
            margin-top: 40px;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            background: #2c3e50; 
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            font-family: 'OpenHuninn', sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #1a252f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .loading {
            opacity: 0.4;
        }

        /* 📱 手機版調整 */
        @media (max-width: 600px) {
            .card {
                width: 85%;
                margin: 25px;
                padding: 40px 20px;
            }
            .quote-text {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
